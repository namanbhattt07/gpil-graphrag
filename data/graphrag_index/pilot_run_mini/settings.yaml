### MINI PILOT index config for the GPIL S&D GraphRAG project.
### Same 32-document pilot corpus and same prompts as ../pilot_run/, but uses
### gpt-4o-mini instead of gpt-4o for the completion model, to compare
### extraction quality/cost against the existing GPT-4o pilot.
### Has its own separate cache/output/logs — does NOT touch ../pilot_run/
### (the GPT-4o pilot, kept untouched for comparison) or ../settings.yaml
### (the production config).

### LLM settings ###

# Carried over unchanged from the GPT-4o pilot's proven rate-limit settings
# (../pilot_run/settings.yaml) — not re-derived for gpt-4o-mini's token
# economics, per explicit instruction to keep this setting as-is.
concurrent_requests: 2

completion_models:
  default_completion_model:
    model_provider: openai
    model: gpt-4o-mini
    api_base: https://api.openai.com/v1
    auth_method: api_key
    api_key: ${OPENAI_API_KEY}
    retry:
      type: exponential_backoff
      # Same retry budget as the GPT-4o pilot (../pilot_run/settings.yaml),
      # carried over unchanged rather than re-tuned for this model.
      max_retries: 10
      max_delay: 30

embedding_models:
  default_embedding_model:
    model_provider: openai
    model: text-embedding-3-small
    api_base: https://api.openai.com/v1
    auth_method: api_key
    api_key: ${OPENAI_API_KEY}
    retry:
      type: exponential_backoff

### Document processing settings ###

input:
  type: text # [csv, text, json, jsonl]

chunking:
  type: tokens
  size: 1200
  overlap: 100
  encoding_model: o200k_base

### Storage settings ###

input_storage:
  type: file # [file, blob, cosmosdb]
  # Points at the same 32-file pilot set in ../input_pilot/ used by the
  # GPT-4o pilot — referenced, not copied, so both pilots read identical
  # unmodified source documents.
  base_dir: "../input_pilot"

output_storage:
  type: file # [file, blob, cosmosdb]
  base_dir: "output"

reporting:
  type: file # [file, blob]
  base_dir: "logs"

cache:
  type: json # [json, memory, none]
  storage:
    type: file # [file, blob, cosmosdb]
    base_dir: "cache"

vector_store:
  type: lancedb
  db_uri: output/lancedb

### Workflow settings ###

embed_text:
  embedding_model_id: default_embedding_model

extract_graph:
  completion_model_id: default_completion_model
  prompt: "../prompts/extract_graph.txt"
  entity_types: [State, Period, Distributor, Category, Franchise, Observation, Metric, Document]
  max_gleanings: 2

summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: "../prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english # [regex_english, syntactic_parser, cfg]

cluster_graph:
  max_cluster_size: 10

extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: "../prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  completion_model_id: default_completion_model
  graph_prompt: "../prompts/community_report_graph.txt"
  text_prompt: "../prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

snapshots:
  graphml: false
  embeddings: false

### Query settings ###

local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  max_context_tokens: 25000
  prompt: "../prompts/local_search_system_prompt.txt"

global_search:
  completion_model_id: default_completion_model
  map_prompt: "../prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "../prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "../prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "../prompts/drift_search_system_prompt.txt"
  reduce_prompt: "../prompts/drift_reduce_prompt.txt"

basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "../prompts/basic_search_system_prompt.txt"
